<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الأفعى للموبايل</title>
    <style>
        body { background: #222; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        canvas { background: #111; border: 3px solid #00ff00; max-width: 90vw; max-height: 40vh; }
        .controls { display: grid; grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(3, 70px); gap: 10px; justify-content: center; margin-top: 15px; }
        .btn { background: #444; color: white; border: none; border-radius: 10px; font-size: 24px; font-weight: bold; cursor: pointer; -webkit-user-select: none; user-select: none; }
        .btn:active { background: #00ff00; color: black; }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <h1>لعبة الأفعى 🐍</h1>
    <div id="score" style="font-size: 22px; margin-bottom: 10px;">النقاط: 0</div>
    <canvas id="game" width="400" height="400"></canvas>

    <!-- أزرار التحكم باللمس للموبايل -->
    <div class="controls">
        <button class="btn up" onclick="changeDir('up')">▲</button>
        <button class="btn left" onclick="changeDir('left')">◀</button>
        <button class="btn right" onclick="changeDir('right')">▶</button>
        <button class="btn down" onclick="changeDir('down')">▼</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 0, dy = 0, score = 0;
        
        function main() {
            if (checkEnd()) { 
                alert("خسرت! اضغط موافق للإعادة"); 
                snake = [{x: 10, y: 10}]; dx=0; dy=0; score=0; 
                document.getElementById("score").innerText = "النقاط: 0"; 
            }
            setTimeout(function() {
                ctx.fillStyle = "#111"; ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = "red"; ctx.fillRect(food.x*20, food.y*20, 18, 18);
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};
                snake.unshift(head);
                if (snake[0].x === food.x && snake[0].y === food.y) { 
                    score++; 
                    document.getElementById("score").innerText = "النقاط: " + score; 
                    food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)}; 
                } else { snake.pop(); }
                ctx.fillStyle = "lime"; snake.forEach(p => ctx.fillRect(p.x*20, p.y*20, 18, 18));
                main();
            }, 120);
        }
        
        function checkEnd() {
            if (snake[0].x < 0 || snake[0].x >= 20 || snake[0].y < 0 || snake[0].y >= 20) return true;
            for (let i = 1; i < snake.length; i++) if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            return false;
        }

        // دالة التحكم باللمس
        function changeDir(dir) {
            if (dir === 'up' && dy === 0) { dx = 0; dy = -1; }
            if (dir === 'down' && dy === 0) { dx = 0; dy = 1; }
            if (dir === 'left' && dx === 0) { dx = -1; dy = 0; }
            if (dir === 'right' && dx === 0) { dx = 1; dy = 0; }
        }

        // أزرار الكيبورد للكمبيوتر تظل تعمل أيضاً
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowUp") changeDir('up');
            if (e.key === "ArrowDown") changeDir('down');
            if (e.key === "ArrowLeft") changeDir('left');
            if (e.key === "ArrowRight") changeDir('right');
        });
        
        main();
    </script>
</body>
</html>
