<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الأفعى المتطورة - المبرمج ابو عبدو محو</title>
    <style>
        body {
            background-color: #1a0933;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            user-select: none;
            touch-action: none;
        }
        h1 {
            color: #d1b3ff;
            margin: 5px 0;
            font-size: 24px;
        }
        #scoreboard {
            font-size: 16px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            display: inline-block;
        }
        #scoreboard span {
            margin: 0 10px;
        }
        #control-selector {
            margin: 10px 0;
            padding: 5px;
            background: #4a154b;
            color: white;
            border: 2px solid #d1b3ff;
            border-radius: 5px;
            font-size: 14px;
        }
        #game-canvas {
            border: 4px solid #4a154b;
            background-color: #2c1654;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        /* منطقة التحكم للموبايل */
        #controls-container {
            margin-top: 15px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* نمط أزرار الأسهم */
        #button-controls {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-gap: 8px;
        }
        .btn {
            width: 50px;
            height: 50px;
            background: #4a154b;
            border: 2px solid #d1b3ff;
            color: white;
            font-size: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn:active { background: #d1b3ff; color: #1a0933; }
        #btn-up { grid-column: 2; }
        #btn-left { grid-column: 1; }
        #btn-right { grid-column: 3; }
        #btn-down { grid-column: 2; }

        /* نمط الدركسيون المتطور */
        #steering-wheel {
            width: 120px;
            height: 120px;
            border: 8px solid #d1b3ff;
            border-radius: 50%;
            background: radial-gradient(circle, #4a154b 30%, #2c1654 70%);
            position: relative;
            cursor: grab;
            box-shadow: 0 0 15px rgba(209, 179, 255, 0.4);
            transition: transform 0.1s linear;
            display: none; /* مخفي افتراضياً */
        }
        #steering-wheel::before, #steering-wheel::after {
            content: '';
            position: absolute;
            background: #d1b3ff;
        }
        /* عوارض الدركسيون الداخية ليظهر مثل سيارة حقيقية */
        #steering-wheel::before { width: 100%; height: 6px; top: 50%; left: 0; transform: translateY(-50%); }
        #steering-wheel::after { width: 6px; height: 50%; bottom: 0; left: 50%; transform: translateX(-50%); }
        #wheel-center {
            width: 24px;
            height: 24px;
            background: #ffda79;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
    </style>
</head>
<body>

    <h1>👑 المبرمج ابو عبدو محو 👑</h1>
    
    <div id="scoreboard">
        <span>النقاط: <b id="score">0</b></span> | 
        <span>الأعلى: <b id="high-score">0</b></span> <br>
        <span style="color: #ffda79;">المرحلة: <b id="level">1</b></span> | 
        <span style="color: #ff7979;">المتبقي: <b id="apples-left">0</b></span>
    </div>

    <br>
    <select id="control-selector" onchange="switchControls(this.value)">
        <option value="buttons">🕹️ التحكم عبر أزرار الأسهم</option>
        <option value="wheel">🛞 التحكم عبر الدركسيون (طارة سيارة)</option>
    </select>

    <br>
    <canvas id="game-canvas" width="400" height="400"></canvas>

    <div id="controls-container">
        <!-- أزرار الأسهم الافتراضية -->
        <div id="button-controls">
            <div class="btn" id="btn-up">▲</div>
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
            <div class="btn" id="btn-down">▼</div>
        </div>

        <!-- دركسيون السيارة المطور -->
        <div id="steering-wheel">
            <div id="wheel-center"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");

        const cellSize = 20;
        const gridCount = canvas.width / cellSize;
        
        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let apple = {x: 5, y: 5};
        let dx = 0;
        let dy = -1;
        
        let score = 0;
        let highScore = 0;
        let currentLevel = 1;
        let applesEatenInLevel = 0;
        let applesNeededForLevel = generateRandomApples();
        
        let baseSpeed = 150;
        let currentSpeed = baseSpeed;
        let gameInterval;

        function generateRandomApples() {
            return Math.floor(Math.random() * 4) + 2; 
        }

        function startGame() {
            updateScoreboard();
            generateApple();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, currentSpeed);
        }

        function gameLoop() {
            moveSnake();
            if (checkGameOver()) {
                alert(`حاول مجدداً يا بطل! أعلى نتيجة لك هي: ${highScore}`);
                resetGame();
                return;
            }
            checkApple();
            drawGame();
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            snake.pop();
        }

        function checkGameOver() {
            const head = snake[0];
            if (head.x < 0 || head.x >= gridCount || head.y < 0 || head.y >= gridCount) return true;
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        function checkApple() {
            const head = snake[0];
            if (head.x === apple.x && head.y === apple.y) {
                score++;
                applesEatenInLevel++;
                if (score > highScore) highScore = score;

                if (score % 6 === 0) {
                    currentSpeed = Math.max(60, currentSpeed - 12);
                    resetInterval();
                }

                if (applesEatenInLevel >= applesNeededForLevel) {
                    currentLevel++;
                    applesEatenInLevel = 0;
                    applesNeededForLevel = generateRandomApples();
                    currentSpeed = Math.max(60, currentSpeed - 10); 
                    resetInterval();
                    alert(`كفو أبو عبدو! المرحلة ${currentLevel} 🎉 اجمع ${applesNeededForLevel} تفاحات!`);
                }

                generateApple();
                snake.push({...snake[snake.length - 1]}); 
                updateScoreboard();
            }
        }

        function resetInterval() {
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, currentSpeed);
        }

        function generateApple() {
            apple.x = Math.floor(Math.random() * gridCount);
            apple.y = Math.floor(Math.random() * gridCount);
            snake.forEach(part => {
                if (part.x === apple.x && part.y === apple.y) generateApple();
            });
        }

        function updateScoreboard() {
            document.getElementById("score").innerText = score;
            document.getElementById("high-score").innerText = highScore;
            document.getElementById("level").innerText = currentLevel;
            document.getElementById("apples-left").innerText = Math.max(0, applesNeededForLevel - applesEatenInLevel);
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            dx = 0; dy = -1; score = 0; currentLevel = 1; applesEatenInLevel = 0;
            applesNeededForLevel = generateRandomApples(); currentSpeed = baseSpeed;
            startGame();
        }

        function drawGame() {
            // خلفية شطرنج بنفسجية
            for (let row = 0; row < gridCount; row++) {
                for (let col = 0; col < gridCount; col++) {
                    ctx.fillStyle = (row + col) % 2 === 0 ? "#2c1654" : "#220f44";
                    ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                }
            }

            // رسم التفاحة 🍎
            ctx.font = `${cellSize - 2}px Arial`;
            ctx.textBaseline = "top";
            ctx.fillText("🍎", apple.x * cellSize, apple.y * cellSize);

            // رسم الدودة الانسيابية بالعيون
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#1e5e20" : "#4caf50";
                ctx.beginPath();
                let centerX = part.x * cellSize + cellSize / 2;
                let centerY = part.y * cellSize + cellSize / 2;
                let radius = cellSize / 2 - 1;
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fill();
                ctx.closePath();

                if (index === 0) {
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
